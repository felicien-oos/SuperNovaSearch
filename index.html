<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>NovaSearch</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 0; text-align: center; }
    header { background-color: #f0f0f0; padding: 20px; font-size: 24px; font-weight: bold; }
    .advertisement { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
    .advertisement img { width: 200px; height: 100px; border-radius: 10px; }
    .search-section { margin-top: 30px; }
    input[type="text"] {
      padding: 10px;
      width: 60%;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background-color: #4285f4;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-left: 10px;
    }
    .result-section, .error-section { display: none; text-align: left; margin-top: 20px; }
    .result-section .response { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
    .result-section .related-sites, .result-section .questions { margin-top: 20px; }
    .result-section .related-sites a, .result-section .questions a {
      font-size: 16px; color: #4285f4; text-decoration: none; display: block; margin: 5px 0;
    }
    .error-section .error-message { font-size: 24px; font-weight: bold; color: red; margin-bottom: 20px; }
    .error-section .related-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .error-section .related-links a { font-size: 18px; color: #4285f4; text-decoration: none; }
    footer { position: fixed; bottom: 0; width: 100%; background: #eee; padding: 10px; display: flex; justify-content: center; gap: 30px; }
    footer img { width: 24px; vertical-align: middle; }
    .logo { margin-top: 20px; }
  </style>
</head>
<body>
  <!-- Header avec le message de bienvenue -->
  <header id="headerText">Bienvenue sur NovaSearch, que puis-je faire pour vous ?</header>

  <!-- Barre de Recherche -->
  <div class="search-section">
    <input type="text" id="searchInput" placeholder="Entrez votre recherche...">
    <button onclick="search()">Rechercher</button>
  </div>

  <!-- Résultats de la Recherche (affichés après la recherche) -->
  <div class="result-section" id="resultSection">
    <div class="response" id="response"></div>
    <div class="related-sites" id="relatedSites">
      <!-- Sites similaires ici -->
    </div>
    <div class="questions" id="questions">
      <!-- Questions similaires ici -->
    </div>
  </div>

  <!-- Erreur lorsqu'on ne connaît pas la réponse -->
  <div class="error-section" id="errorSection">
    <div class="error-message" id="errorMessage">Désolé, je ne sais pas ça.</div>
    <div class="related-links">
      <p>Je ne sais pas la réponse, mais voici des sites qui vous aideront :</p>
      <a href="https://www.google.com" target="_blank">Google</a>
      <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
      <a href="https://www.mozilla.org/firefox/" target="_blank">Firefox</a>
      <a href="https://fr.wikipedia.org" target="_blank">Wikipédia</a>
    </div>
  </div>

  <!-- Footer avec des liens supplémentaires -->
  <footer>
    <div><a href="https://www.google.com" target="_blank">Google</a></div>
    <div><a href="https://www.youtube.com" target="_blank">YouTube</a></div>
    <div><a href="https://www.instagram.com" target="_blank">Instagram</a></div>
    <div><a href="https://www.facebook.com" target="_blank">Facebook</a></div>
    <button onclick="alert('Ajouter un lien personnalisé')">Plus</button>
  </footer>

  <script>
    function search() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      
      // Si la recherche est vide, on ne fait rien
      if (!input) return;

      // On cache l'écran d'accueil (texte, publicités, barre de recherche)
      document.getElementById("headerText").style.display = "none";
      document.querySelector(".search-section").style.display = "none";

      // On cache la section des résultats (si elle est ouverte)
      document.getElementById("resultSection").style.display = "none";
      document.getElementById("errorSection").style.display = "none";

      // Si la réponse est inconnue, on affiche le message d'erreur
      if (input === "2 plus 2") {
        document.getElementById("errorSection").style.display = "block";
      } else {
        // Sinon, on simule l'affichage de résultats
        document.getElementById("resultSection").style.display = "block";
        document.getElementById("response").innerHTML = `Réponse pour "${input}" : La réponse est inconnue, mais voici des résultats qui pourraient vous aider.`;
        
        // Simuler des sites similaires
        const relatedSites = [
          'Site similaire 1 autour de ' + input,
          'Site similaire 2 autour de ' + input,
          'Site similaire 3 autour de ' + input,
        ];
        const sitesContainer = document.getElementById("relatedSites");
        sitesContainer.innerHTML = relatedSites.map(site => `<a href="#">${site}</a>`).join("");

        // Simuler des questions similaires
        const relatedQuestions = [
          'Q: Quel est le lien entre ' + input + ' et la science 1?',
          'Q: Quel est le lien entre ' + input + ' et la science 2?',
          'Q: Quel est le lien entre ' + input + ' et la science 3?',
        ];
        const questionsContainer = document.getElementById("questions");
        questionsContainer.innerHTML = relatedQuestions.map(question => `<a href="#">${question}</a>`).join("");
      }
    }
  </script>
</body>
</html>
